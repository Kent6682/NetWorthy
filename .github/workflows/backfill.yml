name: 回填歷史資產快照

# 刻意只保留手動觸發。
# 補登、編輯、刪除過去的交易之後,每日同步會自動從最早受影響的那天重算,平常不需要跑這支。
# 還需要它的情況:新增一檔以前沒有的股票、而交易日期在過去 —— 每日同步只抓最新收盤價,
# 那段期間的歷史價格要靠這支去證交所補抓,否則那段快照會用成本價估算。
on:
  workflow_dispatch:

# 不要跟每日同步同時寫入快照
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 台股歷史是一檔一個月一次請求,而且要避開證交所的速率限制,可能跑比較久
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 執行回填
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backfill
