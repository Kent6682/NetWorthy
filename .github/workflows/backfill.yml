name: 回填歷史資產快照

# 刻意只保留手動觸發。
# 每日同步只寫「今天」,補登日期在過去的交易之後,要跑這支才會把過去那段補正。
on:
  workflow_dispatch:

# 不要跟每日同步同時寫入快照
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 台股歷史是一檔一個月一次請求,而且要避開證交所的速率限制,可能跑比較久
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 執行回填
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backfill
