name: 每日同步股價與資產快照

on:
  schedule:
    # 分鐘刻意避開 :00 與 :30 —— GitHub 的排程在整點、半點最擁擠,延遲最嚴重
    # (實測 14:30 那班常拖到晚上 8~9 點才跑)。延遲不影響正確性:每次都向交易所
    # 重抓近幾個交易日的正式收盤價,晚跑只是晚一點看到而已。
    #
    # UTC 06:47 = 台灣時間 14:47(台股 13:30 收盤,證交所約 14:00 後公布當日行情)
    - cron: '47 6 * * 1-5'
    # UTC 22:17 = 台灣隔天早上 06:17(美股收盤後),補抓美股與匯率
    - cron: '17 22 * * 1-5'
  # 也可以到 Actions 分頁手動觸發
  workflow_dispatch:

# 同一時間只跑一份,避免兩個排程撞在一起重複寫入
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 執行同步
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync
